[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpc-provisioning-api"
version = "0.1.0"
description = "Authenticated asynchronous API for provisioning AWS VPCs and subnets"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vpc_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
